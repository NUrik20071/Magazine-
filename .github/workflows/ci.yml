name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "audit/**"]

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      PORT: 10000
      BASE_PATH: /
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/magazine_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: magazine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d magazine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm --filter @workspace/db run test:migrations
