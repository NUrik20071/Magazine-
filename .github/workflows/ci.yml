name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "audit/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PORT: 10000
      BASE_PATH: /
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
