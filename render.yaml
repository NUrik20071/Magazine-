services:
  - type: web
    name: maghazin-tovarov
    runtime: node
    plan: free
    buildCommand: >-
      python3 -m venv .venv-media &&
      .venv-media/bin/pip install --disable-pip-version-check --no-cache-dir yt-dlp gallery-dl &&
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @workspace/product-store run build &&
      pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: MEDIA_TOOLS_PYTHON
        value: /opt/render/project/src/.venv-media/bin/python3
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: BASE_PATH
        value: /
      - key: DATABASE_URL
        fromDatabase:
          name: maghazin-tovarov-db
          property: connectionString
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: VITE_CLERK_PROXY_URL
        value: https://maghazin-tovarov.onrender.com/api/__clerk
      - key: ADMIN_EMAILS
        sync: false

databases:
  - name: maghazin-tovarov-db
    plan: free
    databaseName: maghazin_tovarov
    user: maghazin_tovarov
